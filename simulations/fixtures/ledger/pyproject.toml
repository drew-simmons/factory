[project]
name = "ledger"
version = "0.1.0"
description = "A tiny personal ledger: parse transactions, report balances."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ledger = "ledger.cli:entry"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length = 110
