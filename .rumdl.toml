# Mirrors the shared settings in ~/.config/rumdl/rumdl.toml so CI and local
# runs agree. Vendored upstream files are never linted.
[global]
exclude = [
    ".git",
    ".venv/**",
    "node_modules",
    "**/node_modules/**",
    "**/.blume/**",
    "**/dist/**",
    "upstream/**",
    "evals/results/**",
]
# MD041: agent and eval prompts open with frontmatter and no heading on purpose.
disable = ["MD036", "MD041"]

[MD013]
code-blocks = false
reflow = true
