name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Tool pins live here, in one place. Bump them on purpose, in their own PR.
env:
  POLY_CRAP_VERSION: v0.8.2
  LAWBOOK_VERSION: 0.3.1
  CLAUDE_CODE_VERSION: 2.1.296
  SKILLS_REF_COMMIT: 69ef37e9424c0a7ea9dd2293b559e43ec8176379

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install poly-crap
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/drew-simmons/poly-crap/releases/download/${POLY_CRAP_VERSION}/poly-crap-installer.sh" | sh

      - name: Install lawbook and Claude Code
        run: npm install --global "lawbook@${LAWBOOK_VERSION}" "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Vendored upstream matches the manifest
        run: uv run --script scripts/sync-upstream.py verify

      - name: Lockfile matches pyproject
        run: uv lock --check

      - name: Tests
        run: uv run pytest -q --cov --cov-report=lcov:coverage.lcov

      - name: Lint and format
        run: |
          uvx ruff check scripts skills tests
          uvx ruff format --check scripts skills tests

      - name: Shell
        run: uvx --from shellcheck-py shellcheck -S warning -x hooks/*.sh skills/*/scripts/*.sh simulations/*.sh simulations/runs/*.sh simulations/fixtures/*/scaffold.sh evals/*/scaffold.sh

      - name: Markdown
        run: uvx rumdl check README.md CHANGELOG.md skills agents evals simulations docs/content docs/specs

      - name: Agent Skills spec
        run: |
          for skill in skills/*/; do
            uvx --from "git+https://github.com/agentskills/agentskills@${SKILLS_REF_COMMIT}#subdirectory=skills-ref" skills-ref validate "$skill"
          done

      - name: Claude Code plugin
        run: |
          claude plugin validate .claude-plugin/plugin.json --strict
          claude plugin validate plugin.json --strict
          claude plugin validate .claude-plugin/marketplace.json --strict
          claude plugin validate skills --strict
          claude plugin validate agents --strict

      - name: lawbook
        run: lawbook check . --no-llm

      - name: The verify loop, on this repository
        # The same gate the plugin applies to its users, with the same
        # factory.toml. On a push to main the diff is empty and it says so.
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/main' }}
        run: sh skills/verify/scripts/verify.sh

      - name: Upstream drift (informational)
        continue-on-error: true
        run: uv run --script scripts/sync-upstream.py check --fail-if-behind

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@v6

      - name: Next version
        id: next
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "main moved past $GITHUB_SHA; the later run releases"
            exit 0
          fi
          version=$(uv run --script scripts/release.py next)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "next: ${version:-no release}"

      - name: Bump, commit, tag, push
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          uv run --script scripts/release.py bump "$VERSION"
          uv lock
          uvx rumdl check CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json plugin.json pyproject.toml uv.lock CHANGELOG.md
          git commit -q -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"

      - name: GitHub release
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          uv run --script scripts/release.py notes "$VERSION" \
            | gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file -
